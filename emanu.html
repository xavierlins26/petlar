
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174e46">
  <title>Para Emanu</title>
  <link rel="stylesheet" href="css/global.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #f8f6ef;
      color: #174e46;
    }

    .emanu-header {
      padding: 24px;
      text-align: center;
    }

    .emanu-brand {
      color: #174e46;
      font-size: 25px;
      font-weight: 700;
      text-decoration: none;
      letter-spacing: -1px;
    }

    .emanu-main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 40px 20px 60px;
    }

    .emanu-card {
      width: 100%;
      max-width: 600px;
      padding: 48px 36px;
      text-align: center;
      background: #fffefa;
      border: 1px solid #e5e7dc;
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(23, 78, 70, 0.08);
    }

    .emanu-detail {
      display: block;
      margin-bottom: 18px;
      color: #668b76;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .emanu-card h1 {
      margin: 0 0 24px;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.2;
      color: #174e46;
    }

    .emanu-message {
      margin: 0;
      color: #53665d;
      font-size: 17px;
      line-height: 1.9;
    }

    .emanu-line {
      width: 48px;
      height: 3px;
      margin: 30px auto;
      background: #a6c4a0;
      border-radius: 5px;
    }

    .emanu-back {
      display: inline-block;
      margin-top: 8px;
      padding: 12px 22px;
      border-radius: 30px;
      background: #174e46;
      color: white;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s ease;
    }

    .emanu-back:hover {
      background: #23675b;
    }

    .emanu-footer {
      padding: 18px;
      text-align: center;
      color: #718078;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      .emanu-card {
        padding: 38px 24px;
      }

      .emanu-message {
        font-size: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <header class="emanu-header">
    <a href="index.html" class="emanu-brand">PetLar</a>
  </header>

  <main class="emanu-main">
    <section class="emanu-card">
      <span class="emanu-detail">Uma mensagem para você</span>

      <h1>❤️Para Emanu❤️</h1>

      <p class="emanu-message">
        Você é incrível e especial. Muito obrigado por ser você
        e por estar na minha vida. Se não for por você, não faz sentido.❤️❤️
      </p>

      <div class="emanu-line"></div>

      <a href="index.html" class="emanu-back">
        Voltar ao PetLar
      </a>
    </section>
  </main>

  <footer class="emanu-footer">
    Uma pequena página, com uma mensagem especial.
  </footer>
</body>
</html>
